<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Auto-heal: a service worker left by the previous (Imweb) site on this
         domain can intercept requests and serve a stale app shell -> infinite
         loading in returning visitors' browsers. Unregister any SW + clear all
         caches, then reload once. No-op for users without a stale SW. -->
    <script>
      (function () {
        try {
          if (!("serviceWorker" in navigator)) return;
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            if (!regs || !regs.length) return;
            Promise.all(regs.map(function (r) { return r.unregister(); }))
              .then(function () {
                return window.caches && caches.keys
                  ? caches.keys().then(function (ks) {
                      return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                    })
                  : null;
              })
              .then(function () {
                if (!sessionStorage.getItem("kbl-sw-cleared")) {
                  sessionStorage.setItem("kbl-sw-cleared", "1");
                  location.reload();
                }
              })
              .catch(function () {});
          }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12184a" />

    <!-- Default meta (overridden by react-helmet-async per page) -->
    <title>Korea By Local - Authentic Korean Experiences by Locals</title>
    <meta name="description" content="Discover authentic Korean travel experiences curated by locals. Tours, transfers, K-goods, and more." />

    <!-- Default OG -->
    <meta property="og:site_name" content="Korea By Local" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://koreabylocal.com/og-default.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Default Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: Pretendard (body/Korean) + Bricolage Grotesque (display) + Newsreader (serif accent).
         Loaded as non-blocking preloads that swap to an active stylesheet once fetched
         (rather than a plain <link rel="stylesheet">, which would block first paint on
         two external font CSS round-trips), with a noscript fallback for no-JS. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap"
      />
    </noscript>

    <!-- DNS prefetch for Supabase storage -->
    <link rel="dns-prefetch" href="https://agkkvtfwqmzgbrqhvohs.supabase.co" />
    <link rel="preconnect" href="https://agkkvtfwqmzgbrqhvohs.supabase.co" crossorigin />
  </head>
  <body>
    <!-- Painted straight from the HTML, before any JS: the header the app is
         about to render, so the first thing a visitor sees is the site, not a
         blank page. React replaces it on mount; sizes match Header.tsx. -->
    <style>
      .boot{min-height:100vh;background:#fafaf8}
      .boot-h{border-bottom:1px solid rgba(18,24,74,.1)}
      .boot-i{max-width:1320px;margin:0 auto;padding:14px 16px;display:flex;align-items:center}
      .boot-m{width:40px;height:40px;margin:0 4px 0 -4px}
      .boot-i img{height:32px;width:auto;display:block}
      @media (min-width:640px){.boot-i{padding:14px 24px}}
      @media (min-width:1024px){.boot-i{padding:14px 32px}.boot-m{display:none}}
    </style>
    <div id="root"><div class="boot"><div class="boot-h"><div class="boot-i"><span class="boot-m"></span><img src="/logo.png" alt="Korea by Local" width="162" height="32" /></div></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
